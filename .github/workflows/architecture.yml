name: Griplock architecture evidence

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  diagrams:
    name: Review and render architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check architecture review and source evidence
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: npm run docs:check -- --base "$BASE_SHA"
      - name: Checkout pinned diagram renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tt-a1i/archify
          ref: 51a291770851ad27a400cca73c753c166b5e0c65
          path: .architecture-tools/archify
          persist-credentials: false
      - run: npx --no-install playwright install --with-deps chromium
      - name: Generate release-linked architecture drawings
        env:
          ARCHIFY_CLI: .architecture-tools/archify/archify/bin/archify.mjs
        run: |
          export ARCHIFY_CHROME="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run docs:build
      - name: Preserve architecture drawings and checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-${{ inputs.source_sha }}-${{ github.run_id }}
          path: architecture-report/
          if-no-files-found: error
          retention-days: 30
