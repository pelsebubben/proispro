name: Release Griplock staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: griplock-staging-release
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  BICEP_VERSION: v0.48.1
  RESOURCE_GROUP: rg-griplock-staging

jobs:
  build:
    name: Build trusted release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require main and successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: docker build --tag "griplock:$SOURCE_SHA" .
      - run: docker save "griplock:$SOURCE_SHA" | gzip > "$RUNNER_TEMP/griplock.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.sha }}
          path: ${{ runner.temp }}/griplock.tar.gz
          if-no-files-found: error
          retention-days: 1

  staging:
    name: Deploy and verify staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging-infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
      REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
      PULL_IDENTITY: ${{ vars.AZURE_PULL_IDENTITY_ID }}
      PG_ADMIN: ${{ secrets.STAGING_PG_ADMIN_PASSWORD }}
      PG_APP: ${{ secrets.STAGING_PG_APP_PASSWORD }}
    steps:
      - name: Enforce staging prerequisites
        env:
          ENABLED: ${{ vars.INFRA_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$ENABLED" = true
          test -n "$REGISTRY"
          test -n "$REGISTRY_SERVER"
          test -n "$PULL_IDENTITY"
          test "${#PG_ADMIN}" -ge 32
          test "${#PG_APP}" -ge 32
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish exact image to private ACR
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/runtime/griplock.tar.gz" | docker load
          az acr login --name "$REGISTRY"
          docker tag "griplock:$SOURCE_SHA" "$REGISTRY_SERVER/griplock:$SOURCE_SHA"
          docker push "$REGISTRY_SERVER/griplock:$SOURCE_SHA"
          digest=$(az acr repository show --name "$REGISTRY" --image "griplock:$SOURCE_SHA" --query digest -o tsv)
          test "${digest#sha256:}" != "$digest"
          printf 'IMAGE=%s/griplock@%s\n' "$REGISTRY_SERVER" "$digest" >> "$GITHUB_ENV"
          docker logout "$REGISTRY_SERVER"
      - name: Validate and apply private staging infrastructure
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          az extension add --name containerapp --upgrade --only-show-errors
          az deployment group validate --resource-group "$RESOURCE_GROUP" \
            --template-file infra/staging.bicep \
            --parameters image="$IMAGE" registryServer="$REGISTRY_SERVER" pullIdentityId="$PULL_IDENTITY" \
              postgresAdminPassword="$PG_ADMIN" postgresAppPassword="$PG_APP"
          az deployment group what-if --resource-group "$RESOURCE_GROUP" \
            --template-file infra/staging.bicep --result-format ResourceIdOnly \
            --parameters image="$IMAGE" registryServer="$REGISTRY_SERVER" pullIdentityId="$PULL_IDENTITY" \
              postgresAdminPassword="$PG_ADMIN" postgresAppPassword="$PG_APP"
          az deployment group create --resource-group "$RESOURCE_GROUP" --name "core-$GITHUB_RUN_ID" \
            --template-file infra/staging.bicep \
            --parameters image="$IMAGE" registryServer="$REGISTRY_SERVER" pullIdentityId="$PULL_IDENTITY" \
              postgresAdminPassword="$PG_ADMIN" postgresAppPassword="$PG_APP"
      - name: Verify private database and apply schema
        run: |
          set -euo pipefail
          bash scripts/run-staging-job.sh job-griplock-verify
          bash scripts/run-staging-job.sh job-griplock-migrate
      - name: Release immutable app revision
        run: |
          set -euo pipefail
          environment_id=$(az deployment group show -g "$RESOURCE_GROUP" -n "core-$GITHUB_RUN_ID" \
            --query properties.outputs.environmentId.value -o tsv)
          database_host=$(az deployment group show -g "$RESOURCE_GROUP" -n "core-$GITHUB_RUN_ID" \
            --query properties.outputs.databaseHost.value -o tsv)
          az deployment group create -g "$RESOURCE_GROUP" -n "app-$GITHUB_RUN_ID" \
            --template-file infra/app.bicep \
            --parameters environmentId="$environment_id" databaseHost="$database_host" \
              image="$IMAGE" registryServer="$REGISTRY_SERVER" pullIdentityId="$PULL_IDENTITY" \
              sourceSha="$SOURCE_SHA" releaseId="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" postgresAppPassword="$PG_APP"
          url=$(az deployment group show -g "$RESOURCE_GROUP" -n "app-$GITHUB_RUN_ID" \
            --query properties.outputs.url.value -o tsv)
          printf 'STAGING_URL=%s\n' "$url" >> "$GITHUB_ENV"
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --fail --silent --max-time 15 "$url/health/ready" \
              | jq -e --arg sha "$SOURCE_SHA" '.status == "ready" and .sourceSha == $sha and .schemaVersion == 1'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging did not serve the expected release and schema"
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:staging
      - name: Record verified release
        run: |
          jq -n --arg sha "$SOURCE_SHA" --arg image "$IMAGE" --arg url "$STAGING_URL" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{sourceSha:$sha,image:$image,url:$url,run:$run,schemaVersion:1,environment:"staging",identityReady:false}' \
            > staging-release.json
          printf '### Verified staging release\n\nSHA: %s\n\nImage: %s\n\nURL: %s\n\nCustomer sign-in remains disabled.\n' \
            "$SOURCE_SHA" "$IMAGE" "$STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployed browser and release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-evidence-${{ github.run_id }}
          path: |
            staging-release.json
            staging-report/
            staging-results/
          if-no-files-found: warn
          retention-days: 14
