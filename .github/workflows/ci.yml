name: Griplock CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BICEP_VERSION: v0.48.1

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser E2E
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve synthetic test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate Bicep without Azure credentials
        run: |
          az bicep install --version "$BICEP_VERSION"
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Install checksum-verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          gh release download v1.7.7 --repo rhysd/actionlint \
            --pattern actionlint_1.7.7_linux_amd64.tar.gz \
            --pattern actionlint_1.7.7_checksums.txt
          grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum --check --strict
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
      - name: Lint delivery workflows
        run: >-
          "$RUNNER_TEMP/actionlint/actionlint"
          .github/workflows/ci.yml
          .github/workflows/infra.yml
          .github/workflows/deploy.yml
          .github/workflows/squad-ci.yml

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [application, browser, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          APPLICATION: ${{ needs.application.result }}
          BROWSER: ${{ needs.browser.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: |
          test "$APPLICATION" = success
          test "$BROWSER" = success
          test "$INFRASTRUCTURE" = success
