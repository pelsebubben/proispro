name: Deploy Griplock dev

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RESOURCE_GROUP: rg-griplock-staging
  DEV_APP: app-griplock-dev
  DEV_MIGRATION: job-griplock-migrate-dev

jobs:
  dev:
    name: Deploy branch to shared dev
    if: ${{ vars.DEV_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    concurrency:
      group: griplock-dev
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
      REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build branch image
        run: docker build --tag "griplock:dev-$SOURCE_SHA" .
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish branch image to private ACR
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY"
          docker tag "griplock:dev-$SOURCE_SHA" "$REGISTRY_SERVER/griplock:dev-$SOURCE_SHA"
          docker push "$REGISTRY_SERVER/griplock:dev-$SOURCE_SHA"
          digest=$(az acr repository show --name "$REGISTRY" --image "griplock:dev-$SOURCE_SHA" --query digest -o tsv)
          test "${digest#sha256:}" != "$digest"
          printf 'IMAGE=%s/griplock@%s\n' "$REGISTRY_SERVER" "$digest" >> "$GITHUB_ENV"
          docker logout "$REGISTRY_SERVER"
      - name: Apply branch schema to dev database
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update --resource-group "$RESOURCE_GROUP" --name "$DEV_MIGRATION" --image "$IMAGE"
          bash scripts/run-staging-job.sh "$DEV_MIGRATION"
      - name: Release branch to dev app
        id: release
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$DEV_APP" --image "$IMAGE" \
            --revision-suffix "d-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA"
          url="https://$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$DEV_APP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --fail --silent --max-time 30 "$url/health/ready" \
              | jq -e --arg sha "$SOURCE_SHA" '.status == "ready" and .sourceSha == $sha'; then
              printf '### Dev deployed\n\nSHA: %s\n\nURL: %s\n\nShared dev app and griplock_dev database; the next deploy replaces it.\n' \
                "$SOURCE_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Dev did not serve the expected branch commit"
          exit 1
